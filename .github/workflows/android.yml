name: Aura Music V7 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Raspakuj Aura Music V7
        run: |
          test -s MuzikaV7-1.txt
          base64 --decode MuzikaV7-1.txt > aura-v7.zip
          unzip -oq aura-v7.zip

          test -f app/src/main/java/rs/musicflow/app/LyricsRepository.java
          test -f app/src/main/java/rs/musicflow/app/AudioService.java
          test -f app/src/main/java/rs/musicflow/app/MainActivity.java

          grep -q 'rs.musicflow.audio.v7' app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Instaliraj Android platformu
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Kompajliraj V7
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK za telefon
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-V7-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
