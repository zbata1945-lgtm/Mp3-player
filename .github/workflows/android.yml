name: Aura Music V8 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Raspakuj Aura Music V8
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find . -maxdepth 1 -type f -name 'MuzikaV8*.txt' | sort | tail -n 1)
          test -n "$FILE"
          echo "Koristim: $FILE"

          base64 --decode "$FILE" > aura-v8.zip
          unzip -tq aura-v8.zip
          unzip -oq aura-v8.zip

          test -f app/src/main/java/rs/musicflow/app/AudioService.java
          test -f app/src/main/java/rs/musicflow/app/LyricsRepository.java
          grep -q 'rs.musicflow.audio.v8' app/build.gradle
          grep -q 'auto_reconnect_v8' app/src/main/java/rs/musicflow/app/AudioService.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Sastavi V8 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-V8-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
