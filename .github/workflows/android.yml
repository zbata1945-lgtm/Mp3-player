name: Aura Music V9 Offline APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Raspakuj Aura Music V9 Offline
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find . -maxdepth 1 -type f -name 'MuzikaV9_Offline*.txt' | sort | tail -n 1)

          test -n "$FILE"
          test -s "$FILE"

          echo "Koristim: $FILE"

          base64 --decode "$FILE" > aura-v9-offline.zip
          unzip -tq aura-v9-offline.zip
          unzip -oq aura-v9-offline.zip

          test -f app/src/main/java/rs/musicflow/app/OfflineStore.java
          test -f app/src/main/java/rs/musicflow/app/MainActivity.java
          test -f app/src/main/java/rs/musicflow/app/AudioService.java

          grep -q 'rs.musicflow.audio.v9' app/build.gradle
          grep -q 'new DefaultDataSource.Factory' app/src/main/java/rs/musicflow/app/AudioService.java

          ! grep -q 'MusicWidgetProvider' app/src/main/AndroidManifest.xml

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Instaliraj Android 35
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Napravi Android APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK za telefon
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-V9-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
