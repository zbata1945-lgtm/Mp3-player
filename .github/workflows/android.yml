name: Aura Music V11 - Omiljeno APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v4

      - name: Raspakuj Aura Music V11
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find . -maxdepth 1 -type f -name 'MuzikaV11*.txt' | sort | tail -n 1)

          test -n "$FILE"
          test -s "$FILE"

          echo "Koristim: $FILE"

          base64 --decode "$FILE" > aura-v11.zip
          unzip -tq aura-v11.zip
          unzip -oq aura-v11.zip

          test -f app/src/main/java/rs/musicflow/app/FavoritesStore.java
          test -f app/src/main/java/rs/musicflow/app/SmartMixEngine.java
          test -f app/src/main/java/rs/musicflow/app/AudioService.java
          test -f app/src/main/java/rs/musicflow/app/OfflineStore.java
          test -f app/src/main/java/rs/musicflow/app/PhoneMusic.java

          grep -q 'rs.musicflow.audio.v11' app/build.gradle
          grep -q 'favoriteButton' app/src/main/res/layout/activity_main.xml

          ! grep -q 'downloadButton' app/src/main/res/layout/activity_main.xml
          ! grep -q 'chooseDownloadQuality' app/src/main/java/rs/musicflow/app/MainActivity.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android 35
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Napravi V11 APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-V11-Omiljeno-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
