name: MP3 Player V4 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v4

      - name: Raspakuj MP3 Player V4
        run: |
          test -s MuzikaV4.txt
          base64 --decode MuzikaV4.txt > v4.zip
          unzip -oq v4.zip

          test -f app/src/main/java/rs/musicflow/app/MainActivity.java
          test -f app/src/main/java/rs/musicflow/app/AudioService.java

      - name: Instaliraj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instaliraj Android SDK
        uses: android-actions/setup-android@v4

      - name: Instaliraj Android 35
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Instaliraj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Napravi MP3 Player V4
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Sacuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Player-V4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
