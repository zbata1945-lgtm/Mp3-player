name: Aura Music V10.1 - Kontrole APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Raspakuj Aura Music V10.1
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find . -maxdepth 1 -type f -name 'MuzikaV10_1_Kontrole*.txt' | sort | tail -n 1)

          test -n "$FILE"
          test -s "$FILE"

          base64 --decode "$FILE" > aura-v10-1.zip
          unzip -tq aura-v10-1.zip
          unzip -oq aura-v10-1.zip

          test -f app/src/main/java/rs/musicflow/app/AudioService.java

          grep -q 'createLockscreenPlayer' app/src/main/java/rs/musicflow/app/AudioService.java

          grep -q 'rs.musicflow.audio.v10' app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Instaliraj Android 35
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Napravi APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Sacuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-V10-1-Kontrole-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
