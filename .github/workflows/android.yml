name: Aura Music V11.1 - Brzina i stabilnost APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Raspakuj Aura Music V11.1
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find . -maxdepth 1 -type f -name 'MuzikaV11_1*.txt' | sort | tail -n 1)
          test -n "$FILE"
          test -s "$FILE"
          echo "Koristim: $FILE"
          base64 --decode "$FILE" > aura-v11-1.zip
          unzip -tq aura-v11-1.zip
          unzip -oq aura-v11-1.zip
          test -f app/src/main/java/rs/musicflow/app/AudioService.java
          test -f app/src/main/java/rs/musicflow/app/SmartMixEngine.java
          test -f app/src/main/java/rs/musicflow/app/OfflineStore.java
          test -f scripts/run_static_tests.sh
          grep -q 'rs.musicflow.audio.v11p1' app/build.gradle
          grep -q 'stopForUserExit' app/src/main/java/rs/musicflow/app/AudioService.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pokreni logicke i strukturne testove
        run: bash scripts/run_static_tests.sh

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Sastavi Aura Music V11.1
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-V11-1-Stabilno-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
