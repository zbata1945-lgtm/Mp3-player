name: MP3 Player V3 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Raspakuj MP3 Player V3
        run: |
          test -s MuzikaV3.txt
          base64 --decode MuzikaV3.txt > mp3-v3.zip
          unzip -oq mp3-v3.zip
          test -f app/src/main/java/rs/musicflow/app/AudioService.java
          test -f app/src/main/java/rs/musicflow/app/Track.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Instaliraj Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Napravi V3 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Player-V3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
