name: MP3 Player V5 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Raspakuj Aura Music V5
        run: |
          test -s MuzikaV5.txt
          base64 --decode MuzikaV5.txt > aura-v5.zip
          unzip -oq aura-v5.zip
          test -f app/src/main/java/rs/musicflow/app/MainActivity.java
          test -f app/src/main/java/rs/musicflow/app/AudioService.java
          test -f app/src/main/java/rs/musicflow/app/MusicWidgetProvider.java
          test -f app/src/main/res/xml/music_widget_info.xml
          grep -q "audio.v5" app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Instaliraj Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Napravi APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Player-V5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
